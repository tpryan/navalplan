steps:
# 1. Install Frontend Dependencies
- name: 'gcr.io/cloud-builders/npm'
  args: ['install']
  dir: 'app/frontend'

# 2. Build Frontend
# We pass the Mapbox token so it's baked into the JS at build time.
- name: 'gcr.io/cloud-builders/npm'
  args: ['run', 'build']
  dir: 'app/frontend'

# 3. Verify Static Assets
# Vite is configured to build directly into app/backend/static.min
- name: 'ubuntu'
  script: |
    ls -la app/backend/static.min
  
# 4. Test Backend
- name: 'golang'
  args: ['test', './...']
  dir: 'app/backend'
  env:
  - 'GO111MODULE=on'

# 5. Deploy Backend to Cloud Run
- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'run'
  - 'deploy'
  - 'navalplan-backend'
  - '--source'
  - '.'
  - '--region'
  - 'us-central1'
  - '--project'
  - '${PROJECT_ID}'
  - '--allow-unauthenticated' # Publicly accessible
  dir: 'app/backend'
  
logsBucket: gs://navalplan-logging-bucket