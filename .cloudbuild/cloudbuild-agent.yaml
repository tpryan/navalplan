steps:
# 1. Build the container image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/${PROJECT_ID}/navalplan-researcher:${SHORT_SHA}', '-t', 'gcr.io/${PROJECT_ID}/navalplan-researcher:latest', '.']
  dir: 'code/services/researcher'

# 2. Push the container image to Container Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/${PROJECT_ID}/navalplan-researcher:${SHORT_SHA}']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/${PROJECT_ID}/navalplan-researcher:latest']

# 3. Deploy to Cloud Run with --no-traffic
- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'run'
  - 'deploy'
  - 'navalplan-researcher'
  - '--image'
  - 'gcr.io/${PROJECT_ID}/navalplan-researcher:${SHORT_SHA}'
  - '--region'
  - 'us-central1'
  - '--project'
  - '${PROJECT_ID}'
  - '--no-allow-unauthenticated'
  - '--set-secrets=NAVALPLAN_BACKEND_MAPS_API_KEY=NAVALPLAN_BACKEND_MAPS_API_KEY:latest'
  - '--set-secrets=GEMINI_API_KEY=NAVALPLAN_GEMINI_KEY:latest'
  - '--set-secrets=NAVALPLAN_TIDAL_UKTIDAL_API_KEY=NAVALPLAN_TIDAL_UKTIDAL_API_KEY:latest'
  - '--set-secrets=NAVALPLAN_TIDAL_NIWA_API_KEY=NAVALPLAN_TIDAL_NIWA_API_KEY:latest'
  - '--set-env-vars=NAVALPLAN_AGENT_MODEL=${_NAVALPLAN_AGENT_MODEL}'
  - '--set-env-vars=ENV=${_ENV}'
  - '--set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID}'
  - '--set-env-vars=NAVALPLAN_DISABLE_TRACING=false'
  - '--set-env-vars=OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=span_and_event'
  - '--set-env-vars=NAVALPLAN_RESOURCE_ID=projects/${PROJECT_ID}/locations/us-central1/reasoningEngines/1643463669536784384'
  - '--set-env-vars=OTEL_RESOURCE_ATTRIBUTES=cloud.resource_id=projects/${PROJECT_ID}/locations/us-central1/reasoningEngines/1643463669536784384'
  id: 'deploy-cloud-run'

# 4. Deploy to Vertex AI Agent Runtime (Reasoning Engine)
- name: 'google/cloud-sdk:slim'
  id: 'deploy-reasoning-engine'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    apt-get update && apt-get install -y nodejs npm python3-venv
    python3 -m venv /builder/venv
    /builder/venv/bin/pip install uv google-agents-cli
    export PATH="/builder/venv/bin:$$PATH"
    rm -rf vendor researcher
    du -sh .
    agents-cli deploy \
      --project=${PROJECT_ID} \
      --region=us-central1 \
      --deployment-target=agent_runtime \
      --service-name=navalplan-researcher \
      --secrets="NAVALPLAN_BACKEND_MAPS_API_KEY=NAVALPLAN_BACKEND_MAPS_API_KEY,GEMINI_API_KEY=NAVALPLAN_GEMINI_KEY,NAVALPLAN_TIDAL_UKTIDAL_API_KEY=NAVALPLAN_TIDAL_UKTIDAL_API_KEY,NAVALPLAN_TIDAL_NIWA_API_KEY=NAVALPLAN_TIDAL_NIWA_API_KEY" \
      --update-env-vars="NAVALPLAN_AGENT_MODEL=${_NAVALPLAN_AGENT_MODEL},ENV=${_ENV},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},NAVALPLAN_DISABLE_TRACING=false,OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=span_and_event,NAVALPLAN_RESOURCE_ID=projects/${PROJECT_ID}/locations/us-central1/reasoningEngines/1643463669536784384,OTEL_RESOURCE_ATTRIBUTES=cloud.resource_id=projects/${PROJECT_ID}/locations/us-central1/reasoningEngines/1643463669536784384" \
      --no-confirm-project
  dir: 'code/services/researcher'

images:
- 'gcr.io/${PROJECT_ID}/navalplan-researcher:${SHORT_SHA}'
- 'gcr.io/${PROJECT_ID}/navalplan-researcher:latest'

substitutions:
  _NAVALPLAN_AGENT_MODEL: "gemini-3.5-flash-lite"
  _ENV: "production"

logsBucket: gs://navalplan-logging-bucket
