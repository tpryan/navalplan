steps:
# 1. Install Frontend Dependencies
- name: 'node:22-alpine'
  entrypoint: 'npm'
  args: ['install']
  dir: 'code/app/frontend'

# 2. Build Frontend
- name: 'node:22-alpine'
  entrypoint: 'npm'
  args: ['run', 'build']
  dir: 'code/app/frontend'
  secretEnv: ['NAVALPLAN_FRONTEND_MAPS_API_KEY', 'NAVALPLAN_MAP_ID']

# 3. Verify Static Assets
- name: 'ubuntu'
  script: |
    ls -la code/app/backend/static.min
  
# 4. Test Backend
- name: 'golang:1.26'
  args: ['test', './...']
  dir: 'code/app/backend'
  env:
  - 'GO111MODULE=on'

# 5. Build Backend Container Image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/${PROJECT_ID}/navalplan-backend:${_SHORT_SHA}', '-t', 'gcr.io/${PROJECT_ID}/navalplan-backend:latest', '.']
  dir: 'code/app/backend'

# 6. Push Backend Container Image
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/${PROJECT_ID}/navalplan-backend:${_SHORT_SHA}']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/${PROJECT_ID}/navalplan-backend:latest']

# 7. Deploy Backend to Cloud Run
- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'run'
  - 'deploy'
  - 'navalplan-backend'
  - '--image'
  - 'gcr.io/${PROJECT_ID}/navalplan-backend:${_SHORT_SHA}'
  - '--region'
  - 'us-central1'
  - '--project'
  - '${PROJECT_ID}'
  - '--allow-unauthenticated' # Publicly accessible
  - '--timeout=600s'
  - '--set-secrets=NAVALPLAN_AGENT_URL=NAVALPLAN_AGENT_URL:latest'
  - '--set-secrets=NAVALPLAN_DB_USER=NAVALPLAN_DB_USER:latest'
  - '--set-secrets=NAVALPLAN_DB_PASS=NAVALPLAN_DB_PASS:latest'
  - '--set-secrets=NAVALPLAN_DB_PORT=NAVALPLAN_DB_PORT:latest'
  - '--set-secrets=NAVALPLAN_DB_MODE=NAVALPLAN_DB_MODE:latest'
  - '--set-secrets=NAVALPLAN_DB_SOCKET=NAVALPLAN_DB_SOCKET:latest'
  - '--set-secrets=NAVALPLAN_OA_CLIENT=NAVALPLAN_OA_CLIENT:latest'
  - '--set-secrets=NAVALPLAN_OA_SECRET=NAVALPLAN_OA_SECRET:latest'
  - '--set-secrets=NAVALPLAN_SYSTEM_KEY=NAVALPLAN_SYSTEM_KEY:latest'
  - '--set-secrets=NAVALPLAN_FRONTEND_MAPS_API_KEY=NAVALPLAN_FRONTEND_MAPS_API_KEY:latest'
  - '--set-secrets=NAVALPLAN_BACKEND_MAPS_API_KEY=NAVALPLAN_BACKEND_MAPS_API_KEY:latest'
  - '--set-secrets=NAVALPLAN_MAP_ID=NAVALPLAN_MAP_ID:latest'
  - '--set-env-vars=NAVALPLAN_BASE_URL=${_NAVALPLAN_BASE_URL}'
  - '--set-env-vars=NAVALPLAN_PORT=${_NAVALPLAN_PORT}'
  - '--set-env-vars=NAVALPLAN_AGENT_MODEL=${_NAVALPLAN_AGENT_MODEL}'
  - '--set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID}'
  - '--set-env-vars=ENV=${_ENV}'
  - '--set-env-vars=NAVALPLAN_CONTENT_DIR=${_NAVALPLAN_CONTENT_DIR}'
  - '--set-env-vars=NAVALPLAN_DISABLE_TRACING=false'
  - '--set-env-vars=NAVALPLAN_USE_AGENT_REGISTRY=false'
  - '--set-env-vars=OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=span_and_event'
  - '--set-env-vars=NAVALPLAN_RESOURCE_ID=projects/${PROJECT_ID}/locations/us-central1/services/navalplan-backend'
  - '--set-env-vars=OTEL_RESOURCE_ATTRIBUTES=cloud.resource_id=projects/${PROJECT_ID}/locations/us-central1/services/navalplan-backend'

images:
- 'gcr.io/${PROJECT_ID}/navalplan-backend:${_SHORT_SHA}'
- 'gcr.io/${PROJECT_ID}/navalplan-backend:latest'

availableSecrets:
  secretManager:
  - versionName: projects/${PROJECT_ID}/secrets/NAVALPLAN_FRONTEND_MAPS_API_KEY/versions/latest
    env: 'NAVALPLAN_FRONTEND_MAPS_API_KEY'
  - versionName: projects/${PROJECT_ID}/secrets/NAVALPLAN_MAP_ID/versions/latest
    env: 'NAVALPLAN_MAP_ID'

substitutions:
  _SHORT_SHA: "latest"
  _NAVALPLAN_BASE_URL: 'https://plan.wakelog.app'
  _NAVALPLAN_PORT: "8080"
  _NAVALPLAN_AGENT_MODEL: "gemini-3.5-flash-lite"
  _ENV: "production"
  _NAVALPLAN_CONTENT_DIR: "./static.min"

logsBucket: gs://navalplan-logging-bucket