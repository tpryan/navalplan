<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>plan.wakelog.app: Voyage Planner</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sue+Ellen+Francisco&family=Lato:wght@900&family=Raleway:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@40,700,0,0" />
    
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div id="app">
      <div id="auth-container"></div>
      <nav id="sidebar">
        <div class="brand">
          <h1>Plan</h1>
        </div>
        
        <div class="sidebar-actions">
           <button id="btn-new-voyage" class="btn primary">+ New Voyage</button>
        </div>

        <div id="voyage-list">
          <p class="loading-text">Loading voyages...</p>
        </div>

        <div id="itinerary-view" class="hidden">
          <div class="sidebar-actions">
            <button id="btn-back-voyages" class="btn secondary">&larr; Back</button>
            <button id="btn-view-guide" class="btn secondary" title="Destination Guide">
               <span class="material-symbols-outlined icon-lg icon-align">map</span>
            </button>
            <button id="btn-research-all" class="btn secondary" title="Research All">
               <span class="material-symbols-outlined icon-lg icon-align">travel_explore</span>
            </button>
            <button id="btn-export-voyage" class="btn secondary" title="View Full Report">
              <span class="material-symbols-outlined icon-lg icon-align">description</span>
            </button>
          </div>
          <div class="voyage-header">
            <div class="flex justify-between align-start">
              <h2 id="itinerary-title">Voyage Title</h2>
              <button id="btn-edit-voyage" class="btn-icon" title="Edit Voyage">
                <span class="material-symbols-outlined">edit</span>
              </button>
            </div>
            <p id="itinerary-dates">Dates</p>
          </div>
          <div id="itinerary-list">
            <!-- Daily stops will go here -->
          </div>
        </div>
      </nav>

      <main id="map-container"></main>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="hidden"></div>
    
    <div id="modal-new-voyage" class="modal hidden">
      <h2>Plan a New Voyage</h2>
      <form id="form-new-voyage">
        <div class="form-group">
          <label for="voyage-title">Trip Title</label>
          <input type="text" id="voyage-title" name="title" required placeholder="e.g. Gulf Islands 2025" />
        </div>
        
        <div class="form-group">
          <label>Starting Location</label>
          <div class="flex gap-sm">
            <input type="text" id="voyage-location-name" name="location_name" placeholder="e.g. Seattle" />
            <button type="button" id="btn-use-map-center" class="btn secondary p-sm w-auto">Use Map Center</button>
          </div>
          <input type="hidden" id="voyage-lat" name="latitude" />
          <input type="hidden" id="voyage-lng" name="longitude" />
          <p id="voyage-coords-display" class="font-sm text-gray mt-xs"></p>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="voyage-start">Start Date</label>
            <input type="date" id="voyage-start" name="start_date" required />
          </div>
          <div class="form-group">
            <label for="voyage-end">End Date</label>
            <input type="date" id="voyage-end" name="end_date" required />
          </div>
        </div>

        <div class="form-actions">
          <button type="button" id="btn-cancel-voyage" class="btn secondary">Cancel</button>
          <button type="submit" class="btn primary">Create Voyage</button>
        </div>
      </form>
    </div>

    <div id="modal-briefing" class="modal hidden modal-scrollable">
      <div class="modal-header-row flex justify-between align-center">
        <h2 class="m-0">Destination Briefing</h2>
        <div class="flex gap-sm">
            <button id="btn-redo-briefing" class="btn secondary p-xs font-sm" title="Redo Research">
                <span class="material-symbols-outlined icon-lg icon-align">refresh</span>
                Redo
            </button>
            <button id="btn-close-briefing" class="btn-icon icon-xl"><span class="material-symbols-outlined">close</span></button>
        </div>
      </div>
      <div id="briefing-content" class="briefing-body"></div>
    </div>

    <div id="modal-guide" class="modal hidden modal-scrollable">
      <div class="modal-header-row flex justify-between align-center">
        <h2 class="m-0">Destination Guide</h2>
        <div class="flex gap-sm">
             <button id="btn-redo-guide" class="btn secondary p-xs font-sm" title="Redo Research">
                <span class="material-symbols-outlined icon-lg icon-align">refresh</span>
                Redo
            </button>
            <button id="btn-close-guide" class="btn-icon icon-xl"><span class="material-symbols-outlined">close</span></button>
        </div>
      </div>
      <div id="guide-content" class="briefing-body"></div>
    </div>

    <!-- Report Modal -->
    <div id="modal-report" class="modal hidden modal-scrollable flex flex-col">
        <div class="modal-header-row flex justify-between align-center">
            <h2 class="m-0">Voyage Report</h2>
            <div class="flex gap-sm">
                <button id="btn-copy-report" class="btn primary px-md py-sm">Copy to Clipboard</button>
                <button id="btn-close-report" class="btn-icon icon-xl"><span class="material-symbols-outlined">close</span></button>
            </div>
        </div>
        <div id="report-content" class="report-body modal-content-scroll">
            <!-- Report HTML injected here -->
        </div>
    </div>

    <!-- Notification Modal -->
    <div id="modal-notification" class="modal hidden text-center">
        <h2 id="notification-title" class="mb-md">Notification</h2>
        <p id="notification-message" class="mb-lg text-dark"></p>
        <button id="btn-close-notification" class="btn primary">Close</button>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
