<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavalPlan - Access Denied</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .unauth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        h1 { margin-bottom: 1rem; }
        p { margin-bottom: 2rem; max-width: 600px; }
        a.btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: var(--color-primary, #007bff);
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        a.btn:hover {
            background-color: var(--color-primary-dark, #0056b3);
        }
    </style>
</head>
<body>
    <div class="unauth-container">
        <h1>Access Denied</h1>
        <p>This is an invite-only service. Your email address has not been invited yet.</p>
        <p>If you believe this is a mistake, please contact an administrator.</p>
        <a href="/" class="btn">Return to Home</a>
    </div>
</body>
</html>
